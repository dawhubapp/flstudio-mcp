[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flstudio-mcp"
version = "0.1.0.dev0"
description = "MCP server exposing FL Studio project introspection and mutation as LLM tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Roman Pronskiy", email = "roman@pronskiy.com" }]
keywords = ["fl-studio", "mcp", "model-context-protocol", "daw", "music-production"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]

# Notes:
# - PyFLP is intentionally NOT a dependency. The offline runtime calls the
#   canonical TS parser from `flpdiff` via a Node child_process (decision #21
#   in MCP-SPEC.md).
# - `re-harness` is the standalone Python package extracted from
#   `python/tools/re_harness/` (decision #25, see MCP-SPEC.md). Pinned via
#   path-dep below so dev edits propagate without a reinstall; production
#   installs (PyPI / git+) replace the source entry.
dependencies = [
    "mcp>=1.0",
    "pydantic>=2.6",
    "click>=8.1",
    "re-harness>=0.1.0",
]

[tool.uv.sources]
re-harness = { path = "../python/tools/re_harness", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "pre-commit>=3.6",
]

[project.scripts]
flstudio-mcp = "flstudio_mcp.server:main"

[project.urls]
Homepage = "https://github.com/pronskiy/dawhub"
Repository = "https://github.com/pronskiy/dawhub"
Issues = "https://github.com/pronskiy/dawhub/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/flstudio_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# fl_script/ is deployed verbatim into FL Studio's embedded Python — keep
# it free of stylistic auto-modifications and lint noise from rules that
# don't apply (FL's interpreter is older, sandboxed, no contextlib needed).
extend-exclude = ["**/fl_script/device_*.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: live integration tests requiring FL Studio (set FLSTUDIO_MCP_INTEGRATION=1 to run)",
]

# House blueprint: arrangement rules.
# Measured 2026-10-08 on 6 reference house arrangements (104-208 bars each):
# section lengths, the share of each section's bars a part plays, and what
# happens at phrase ends. Section energy matches beat_check.DEFAULT_SECTION_ENERGY.

genre = "house"
phrase_bars = 8

[bpm]
min = 120
max = 128
default = 124

# Parts are "<role>.<layer>"; roles are beat_check.ROLES.
[layers]
kick = ["main"]
clap = ["main", "loop"]
snare = ["build"]
hat = ["offbeat", "closed_16th", "loop", "ride"]
perc = ["loop", "hit"]
bass = ["main", "layer"]
chords = ["chords", "stab"]
lead = ["main"]

# Forms are [section, bars] in order.
[forms]
beat_32 = [["intro", 8], ["build", 8], ["drop", 16]]
beat_64 = [["intro", 8], ["build", 8], ["drop", 16], ["break", 8], ["build", 8], ["drop", 16]]
song = [
    ["intro", 16], ["break", 8], ["build", 8], ["drop", 32],
    ["break", 16], ["build", 8], ["drop", 32], ["outro", 16],
]

# parts: share of the section's bars the part plays, in arrangements that
# have the part. >= 0.5 usually on, 0.25-0.5 optional; parts under 0.25 are
# left out (off).
[sections.intro]
bars = [8, 16, 24]
energy = 0.3
[sections.intro.parts]
"kick.main" = 0.67
"clap.main" = 0.56
"hat.offbeat" = 0.53
"hat.closed_16th" = 0.60
"hat.loop" = 0.38
"hat.ride" = 0.44
"perc.loop" = 0.60
"bass.main" = 0.64
"chords.stab" = 0.50
"lead.main" = 0.25
"snare.build" = 0.26

[sections.break]
bars = [8, 16, 24]
energy = 0.4
[sections.break.parts]
"kick.main" = 0.29
"clap.main" = 0.58
"hat.offbeat" = 0.88
"hat.closed_16th" = 0.67
"hat.loop" = 0.63
"hat.ride" = 0.73
"perc.loop" = 0.72
"perc.hit" = 0.52
"bass.main" = 0.44
"bass.layer" = 0.26
"chords.chords" = 0.50
"lead.main" = 0.40

[sections.build]
bars = [8, 16]
energy = 0.6
[sections.build.parts]
"kick.main" = 0.94
"clap.main" = 0.52
"snare.build" = 1.00
"hat.offbeat" = 0.58
"hat.closed_16th" = 0.60
"hat.loop" = 0.43
"hat.ride" = 0.67
"perc.loop" = 0.55
"perc.hit" = 0.32
"bass.main" = 0.44
"chords.chords" = 0.96
"chords.stab" = 0.50
"lead.main" = 0.44

[sections.drop]
bars = [16, 24, 32, 48, 64]
energy = 1.0
[sections.drop.parts]
"kick.main" = 0.90
"clap.main" = 0.99
"clap.loop" = 0.61
"hat.offbeat" = 0.90
"hat.closed_16th" = 0.62
"hat.loop" = 0.82
"perc.loop" = 0.57
"perc.hit" = 0.39
"bass.main" = 0.99
"bass.layer" = 0.73
"chords.chords" = 0.53
"chords.stab" = 0.37
"lead.main" = 0.66

[sections.outro]
bars = [16, 24]
energy = 0.3
[sections.outro.parts]
"kick.main" = 1.00
"clap.main" = 0.75
"hat.offbeat" = 0.25
"hat.closed_16th" = 0.88
"hat.loop" = 1.00
"hat.ride" = 0.67
"perc.loop" = 0.67
"perc.hit" = 0.50
"bass.main" = 0.42
"bass.layer" = 0.33
"chords.chords" = 0.75
"lead.main" = 1.00

[transitions]
# Consecutive 8-bar phrases that use a different set of parts (82 of 99).
phrase_change = 0.83
# Phrase ends (last bar of each 8) with at least one device below (81 of 105).
phrase_end_any = 0.77

# Device starting in the last bar of a phrase (105 phrase ends).
# fx = reverse cymbal / white-noise sweep / riser (FL Packs: Risers, SFX).
[transitions.phrase_end]
fill = 0.32
fx = 0.22
vocal_chop = 0.18
perc_hit = 0.15

# Part that plays bars 1-7 of a phrase but rests in bar 8.
[transitions.last_bar_rest]
"kick.main" = 0.09
"hat.offbeat" = 0.15
"bass.main" = 0.06
"perc.loop" = 0.08

# Part that played the bars before a drop but rests in the bar just before it.
# Rare: drops are set up by the build's snare roll and fx, not by silence.
[transitions.pre_drop_silent]
"kick.main" = 0.10
"clap.main" = 0.09
"hat.offbeat" = 0.25
"perc.loop" = 0.33

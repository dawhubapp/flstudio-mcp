name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dev dependencies
        run: uv sync --extra dev --extra eval --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Unit tests (pytest)
        run: uv run pytest -ra
        env:
          # Integration tests require FL Studio + opt-in; never enabled in CI.
          FLSTUDIO_MCP_INTEGRATION: ""

  offline-windows:
    # L-4: offline mode is the cross-platform surface; this job is the
    # cheap proof. Live-mode (IAC/AppleScript) stays macOS-only.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dev dependencies
        run: uv sync --extra dev --extra eval --python 3.12
      - name: Offline-mode unit tests
        run: uv run pytest tests/test_smoke.py tests/test_offline_runtime.py tests/test_offline_tool.py -ra

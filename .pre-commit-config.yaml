# vendor/ is a manually-synced verbatim copy of python/tools/re_harness from
# the dawhub workspace — excluded so these hooks don't drift it from the
# source of truth (see vendor/README.md).
exclude: ^vendor/

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
